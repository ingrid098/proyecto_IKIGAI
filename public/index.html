<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #45a049;
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            border-bottom: 2px solid #4CAF50;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
        }

        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }

        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Sistema de Autenticación</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Iniciar Sesión</div>
            <div class="tab" onclick="switchTab('register')">Registrarse</div>
        </div>

        <!-- Formulario de Login -->
        <div id="login-form" class="tab-content active">
            <div class="form-group">
                <label for="login-username">Usuario</label>
                <input type="text" id="login-username" placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="login-password">Clave</label>
                <input type="password" id="login-password" placeholder="Ingrese su clave">
            </div>
            <button onclick="login()">Ingresar</button>
            <div id="login-message" class="message"></div>
        </div>

        <!-- Formulario de Registro -->
        <div id="register-form" class="tab-content">
            <div class="form-group">
                <label for="register-username">Usuario</label>
                <input type="text" id="register-username" placeholder="Cree un nombre de usuario">
            </div>
            <div class="form-group">
                <label for="register-password">Clave</label>
                <input type="password" id="register-password" placeholder="Cree una contraseña">
            </div>
            <button onclick="register()">Registrar</button>
            <div id="register-message" class="message"></div>
        </div>
    </div>

    <script>
        // Cambiar entre pestañas
        function switchTab(tabName) {
            // Actualizar pestañas activas
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Activar la pestaña seleccionada
            if (tabName === 'login') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // Mostrar mensaje
        function showMessage(elementId, message, isSuccess) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'message ' + (isSuccess ? 'success' : 'error');
            element.style.display = 'block';
        }

        // Login
        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('login-message', 'Autenticación satisfactoria. Redirigiendo...', true);
                    // Aquí podrías guardar el token y redirigir
                    console.log('Token:', data.token);
                } else {
                    showMessage('login-message', data.message || 'Error en la autenticación', false);
                }
            } catch (error) {
                showMessage('login-message', 'Error de conexión con el servidor', false);
                console.error('Error:', error);
            }
        }

        // Registro
        async function register() {
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;

            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('register-message', 'Registro exitoso. Ahora puedes iniciar sesión.', true);
                    // Limpiar formulario y cambiar a login
                    document.getElementById('register-username').value = '';
                    document.getElementById('register-password').value = '';
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMessage('register-message', data.message || 'Error en el registro', false);
                }
            } catch (error) {
                showMessage('register-message', 'Error de conexión con el servidor', false);
                console.error('Error:', error);
            }
        }
    </script>
</body>

</html>
